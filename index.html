<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>運転台 鉄道運転シミュレーター</title>
<style>

</style></head><body><main>
<h1>運転台 鉄道運転シミュレーター</h1>
<div class="stage"><canvas id="gl" width="960" height="720"></canvas><canvas id="c" width="960" height="720"></canvas><div id="ov"></div></div>
<div class="ctl"><button id="bu">▲ 力行 / ブレーキ緩め</button><button id="bd">▼ ブレーキ / 力行戻し</button><button id="bn">N（切）</button><button id="be" class="eb">非常ブレーキ</button><button id="bmc">マスコン表示 (M)</button><button id="bka">ATS確認 (C)</button><button id="bre">ATS復帰 (R)</button><button id="bdo">ドア開 (O)</button><button id="bdc">ドア閉 (L)</button><button id="btt">時刻表 (T)</button><button id="bhn">警笛 (H)</button><button id="bsn">音 ON/OFF (V)</button></div>
<p class="hint">キー操作: ↑↓（W/S）でマスコン、N で切、Space で非常ブレーキ、C でATS確認、R でATS復帰、M でマスコン表示切替、O／L でドア開／閉、T で時刻表表示切替、H で警笛（押している間）、V でサウンド切替　［版：無線機設置・計器は操作台］</p>
</main><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');
const W=960,H=720,hy=225,F=560,CH=2.7;
const ST=[{n:'あおば台',x:0,t:null,dep:0},{n:'みなと町',x:1500,t:140,dep:165},{n:'さくら野',x:3200,t:320,dep:345},{n:'とうげ',x:4700,t:475,dep:null}];
const T0=10*3600+12*60,hms=t=>{t=Math.round(T0+t);const p=v=>String(v).padStart(2,'0');return p(Math.floor(t/3600))+':'+p(Math.floor(t/60)%60)+':'+p(t%60)};
const platOK=(x,i)=>x<=ST[i].x+20&&x-TLEN>=ST[i].x-100;// 車両全体がホーム（停止位置-100m〜+20m）にかかっている
const LIM=[[-300,250,55],[250,900,80],[900,1300,85],[1300,1790,70],[1790,2500,55],[2500,3050,85],[3050,3500,70],[3500,3950,80],[3950,4400,85],[4400,9e3,60]];
const CUR=[[400,800,1/700],[1000,1250,-1/600],[1900,2450,1/450],[2650,3000,-1/800],[3600,4000,1/600],[4100,4500,-1/500]];
const limAt=x=>{for(const z of LIM)if(x>=z[0]&&x<z[1])return z[2];return 60};
// 緩和曲線：曲線の両端で曲率を直線的に変化（長さは最大60m）。カントも同じ区間で逓減
const TRL=c=>Math.min(60,(c[1]-c[0])/4),rmp=(c,x)=>Math.min(1,(x-c[0])/TRL(c),(c[1]-x)/TRL(c));
const curv=x=>{for(const c of CUR)if(x>=c[0]&&x<c[1])return c[2]*rmp(c,x);return 0};
// カント（mm）：均衡カント 8.4V²/R の6割（不足カントを許容）、上限105mm、5mm単位
const CANT=CUR.map(c=>Math.min(105,Math.round(.6*8.4*limAt((c[0]+c[1])/2)**2*Math.abs(c[2])/5)*5));
const cantAt=x=>{for(let i=0;i<CUR.length;i++){const c=CUR[i];if(x>=c[0]&&x<c[1])return Math.sign(c[2])*CANT[i]/1067*rmp(c,x)}return 0};// 傾斜角(rad)。正=右曲線で左（外軌）が高い
const GRD=[[300,700,18],[1000,1350,-15],[2000,2400,25],[2600,3000,-25],[3800,4200,20]];
const TUN=[[1800,2100],[3650,3900]],XNG=[650,2780,4250];
const SIGS=[{x:450},{x:1000,w:[25,70]},{x:1700},{x:2300,w:[135,175]},{x:2900},{x:3500},{x:4100,w:[350,400]},{x:4500}];
const grdAt=x=>{for(const z of GRD)if(x>=z[0]&&x<z[1])return z[2];return 0};
// 縦曲線：勾配変化点を前後30mで滑らかに（半径およそ2,400m相当）
const grdV=x=>{let t=0;for(let k=-15;k<=15;k++)t+=grdAt(x+k*2);return t/31};
// 列車長（AR300形 約18.5m）。勾配・曲線抵抗は車両全長で平均、制限速度は後部が抜けるまで有効
const TLEN=18.5,trAvg=f=>x=>{let t=0;for(let k=0;k<5;k++)t+=f(x-TLEN*k/4);return t/5},grdT=trAvg(grdV),crvT=trAvg(x=>Math.abs(curv(x)));
const limT=x=>Math.min(limAt(x),limAt(x-TLEN));
const inTun=x=>TUN.some(t=>x>=t[0]&&x<t[1]);
// 丘陵の高さ（線路面基準, m）と、切土・坑門を反映した地表高
const HILL_H=22,HF=8.5,CUTK=1.25,sst=(e0,e1,x)=>{const t=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return t*t*(3-2*t)};
const hillH=(s,l)=>{let m=0;for(const[a,b]of TUN){const fs=sst(a-120,a-10,s)*(1-sst(b+10,b+120,s));if(fs>0)m=Math.max(m,HILL_H*fs*(1-sst(14,58,Math.abs(l)))*(.85+.15*Math.sin(s*.031+l*.07)))}return m};
const terH=(s,l)=>{const h=hillH(s,l),cu=Math.max(0,Math.abs(l)-4.5)*CUTK;for(const[a,b]of TUN)if(s>=a&&s<=b)return Math.min(h,Math.max(HF,cu)+Math.min(s-a,b-s));return Math.min(h,cu)};
const ATS_LC=600,ATS_SP=[[150,55],[60,35]],ATS_SL=12;// ロング地上子の距離、速度照査（信号手前m, 照査速度km/h）、時素地上子の間隔m
const ASP={R:999,Y:45,YG:65,G:999},NM={R:'停止',Y:'注意',YG:'減速',G:'進行'};
function aspect(i){const a=S.sg;if(a[i].red)return'R';if(a[i+1]&&a[i+1].red)return'Y';if(a[i+2]&&a[i+2].red)return'YG';return'G'}
const hash=k=>{const v=Math.sin(k*127.1)*43758.5453;return v-Math.floor(v)};
let S,last=0;
// 車両諸元（AR300形相当の単行気動車。液体式：変速段=トルクコンバータ、直結段=直結1段）
const DC={m:34,me:36e3,pm:217e3,ni:650,nx:2100,vd:25.6,t0:3,up:55,dn:42,nf:[0,.18,.4,.6,.8,1]};
function init(){S={atsw:0,atsk:0,atsr:'',sc:{},ovp:false,sg:SIGS.map(()=>({dec:false,red:false})),si:-1,lim:55,x:0,v:0,lev:-4,lv:-4,pw:0,br:0,ne:DC.ni,gear:'N',sh:0,bc:0,ft:0,mr:8.8,cmp:false,bg:0,clock:-30,run:false,cur:1,doors:true,bd:12,at:0,opened:true,dres:[],ats:false,atsT:0,over:0,res:[],pen:0,msg:'',mt:0,warned:false,state:'title'}}
function toast(m,t=3){S.msg=m;S.mt=t}
function start(){ov.style.display='none';init();S.state='run';SND.init();SND.reset()}
function showTitle(){ov.style.display='flex';ov.innerHTML='<div class="box"><h2>運転台に乗ろう</h2><p>あおば台 → みなと町 → さくら野 → とうげ。運転席からの眺めで、4駅を時刻通りに、停止位置ぴったりに走らせます。</p><ul><li>↑↓キー（またはボタン）でマスコン操作。力行 P1〜P5、ブレーキ B1〜B8、Space で非常ブレーキ</li><li>制限速度標識（白地に黒の数字）の速度を守ってください。超過が続くと減点されます（ATS-SKは速度を常時は監視しません）</li><li>停車駅の手前には「停車駅接近」の標識があります。ホームの黄色い停止位置目標に先頭を合わせて停めてください。制限速度は、列車の後部（車長18.5m）が制限区間を抜けるまで有効です。残り距離の表示はありません</li><li>ワンマン運転です。発駅あおば台では乗降中から始まります。乗降が終わったら L でドアを閉め（戸閉め知らせ灯が点灯）、時刻表の発車時刻に出発信号の進行を確認して発車します。早発・出発信号冒進は減点です</li><li>停車したらブレーキを入れたまま O でドアを開けます（右側、車両全体がホームにかかっていること）。乗降中に閉めると減点、ドアを開けずに発車すると客扱い忘れで減点。ドアが開いている間は力行できません（戸閉め連動）。終着とうげではドアを開けると運転終了です</li><li>車両は甘木鉄道AR301（AR300形）をモデルにした単行のワンマン気動車です。機関は295PS（定格2,100rpm）、液体式、三管式直通空気ブレーキ、最高速度は85km/h。約55km/hで変速段から直結段に自動で切り替わり、切替中は一瞬加速が途切れます。運転台の配置は、新型ARe501の運転台写真を参考にしています（AR301の実車とは異なる場合があります）。ワンハンドルのマスコン（通常は画面外。Mキーで表示を切り替え。段位と速度は左上に表示）、速度計と圧力計、モニターがあります</li><li>上り下りの勾配、トンネル、踏切があります。下り坂では何もしなくても加速します</li><li>信号は、赤＝停止、黄＝注意（45km/h以下）、青（緑）と黄＝減速（65km/h以下）、青（緑）＝進行です（速度は鉄道会社により異なります）。保安装置はATS-SK型です。停止信号の約600m手前（ロング地上子）で警報ベルが鳴ります。ブレーキを入れたうえで5秒以内に「C」キーで確認扱いをすると、ベルがチャイムに変わります。チャイムは「R」キー（復帰）で止めます。停止信号を越える（直下地上子）、停止信号の手前で速すぎる（2個の地上子の通過時間で判定する速度照査）、警報を確認しない、のいずれかで非常ブレーキがかかり、停止後に「R」キーで復帰します</li></ul><button class="pri" id="go">運転開始</button></div>';document.getElementById('go').onclick=start}
function showEnd(){const s=S,tot=s.res.reduce((a,r)=>a+r.sp+r.pu,0)-s.pen,rk=tot>=380?'S':tot>=300?'A':tot>=220?'B':'C';
ov.style.display='flex';ov.innerHTML='<div class="box"><h2>運転終了　評価 '+rk+'</h2><table><tr><th>駅</th><th>停止誤差</th><th>定時差</th><th>点</th></tr>'+s.res.map(r=>'<tr><td>'+r.n+'</td><td>'+(r.e>=0?'+':'')+r.e.toFixed(1)+'m</td><td>'+(r.d>=0?'+':'')+r.d+'秒</td><td>'+(r.sp+r.pu)+'</td></tr>').join('')+'<tr><td>減点（ATS・取扱い）</td><td></td><td></td><td>-'+s.pen+'</td></tr><tr><td><b>合計</b></td><td></td><td></td><td><b>'+tot+'</b></td></tr></table><button class="pri" id="go">もう一度</button></div>';document.getElementById('go').onclick=start}
function setLev(v){if(S.state==='run'&&!S.ats)S.lev=v}
function atsEB(r,p){if(S.state==='run'&&!S.ats){S.ats=true;S.atsw=0;S.atsk=0;S.pen+=p;S.atsr=r;toast('ATS-SK作動：'+r+'（非常ブレーキ -'+p+'点）',4)}}
function atsAck(){if(S.state==='run'&&S.atsw>0){if(S.lev>=0){toast('ブレーキを入れてから確認扱いをしてください');return}S.atsw=0;S.atsk=1e9;toast('確認扱い。チャイムは R（復帰）で止めます')}}
function atsReset(){if(S.state==='run'&&S.ats){if(S.v<.05){S.ats=false;S.over=0;S.lev=0;S.atsr='';toast('ATS復帰。マスコンをNから操作してください')}else toast('停止してから復帰扱いをしてください')}else if(S.state==='run'&&S.atsk>0){S.atsk=0;toast('ATS 復帰扱い（チャイム停止）')}}
function lever(d){if(S.state==='run'&&!S.ats)S.lev=Math.max(-9,Math.min(5,S.lev+d))}
addEventListener('keydown',e=>{const k=e.key;if(['ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();if(e.repeat)return;
if(k==='ArrowUp'||k==='w'||k==='W')lever(1);else if(k==='ArrowDown'||k==='s'||k==='S')lever(-1);else if(k==='n'||k==='N')setLev(0);else if(k===' ')setLev(-9);else if(k==='m'||k==='M')showCtl=!showCtl;else if(k==='c'||k==='C')atsAck();else if(k==='r'||k==='R')atsReset();else if(k==='h'||k==='H')SND.horn(true);else if(k==='v'||k==='V')SND.toggle();else if(k==='o'||k==='O')doorOpen();else if(k==='l'||k==='L')doorClose();else if(k==='t'||k==='T')showTT=!showTT});
addEventListener('keyup',e=>{if(e.key==='h'||e.key==='H')SND.horn(false)});
bu.onclick=()=>lever(1);bd.onclick=()=>lever(-1);bn.onclick=()=>setLev(0);be.onclick=()=>setLev(-9);bmc.onclick=()=>{showCtl=!showCtl};bka.onclick=atsAck;bre.onclick=atsReset;bhn.onpointerdown=()=>SND.horn(true);bhn.onpointerup=bhn.onpointerleave=bhn.onpointercancel=()=>SND.horn(false);bsn.onclick=()=>SND.toggle();bdo.onclick=doorOpen;bdc.onclick=doorClose;btt.onclick=()=>{showTT=!showTT};

function arrive(e){const s=S,st=ST[s.cur],d=Math.round(s.clock-st.t);
const sp=e>10?0:Math.max(0,Math.round(100-Math.abs(e)*6)),pu=Math.max(0,Math.round(50-Math.abs(d)*2));
s.res.push({n:st.n,e,d,sp,pu});
toast(e>10?'オーバラン！ 停止点 0':st.n+' 到着　誤差 '+(e>=0?'+':'')+e.toFixed(1)+'m　'+(sp+pu)+'点',4);
s.at=s.cur;s.opened=false;s.cur++}
// ドア扱い（ワンマン：運転士が右側ドアを扱う）
function doorOpen(){const s=S;if(s.state!=='run'||s.doors)return;if(s.v>.05){toast('走行中はドアを開けられません');return}if(s.lev>=0&&!s.ats){toast('ブレーキを入れてからドアを開けてください');return}
if(s.at==null||!platOK(s.x,s.at)){toast('ホームのない位置です。ドアを開けられません');return}s.doors=true;s.opened=true;s.bd=6+hash(s.at*3.3+s.clock)*8;toast('ドア開');
if(s.at===ST.length-1){s.bd=1e9;s.state='end';setTimeout(showEnd,2500)}}
function doorClose(){const s=S;if(s.state!=='run'||!s.doors)return;if(s.bd>0){s.pen+=10;s.bd=3;toast('乗降中に閉扉：ドア挟み（-10点）。再開扉します',3);return}s.doors=false;toast('ドア閉。戸閉め知らせ灯点灯')}
// 出発信号：停車中の駅では、ドアが閉まり発車15秒前になるまで停止現示
const startSig=i=>{const s=S;return s.at===i&&(s.doors||ST[i].dep==null||s.clock<ST[i].dep-15)?'R':'G'};
function depart(){const s=S,i=s.at,st=ST[i],dd=Math.round((s.mv!=null?s.mv:s.clock)-st.dep);s.mv=null;let p=0,m='';
if(!s.opened){p+=50;m+='客扱い忘れ（-50点）'}if(dd<0){const q=Math.min(50,-dd*5);p+=q;m+=(m?'　':'')+'早発 '+(-dd)+'秒（-'+q+'点）'}
s.pen+=p;s.dres.push({n:st.n,d:dd});s.at=null;s.run=true;toast(m||(st.n+' 発車　'+(dd>0?'+'+dd+'秒':'定時')),m?4:2.5)}

function step(dt){const s=S;if(s.mt>0)s.mt-=dt;
const L=s.ats?-9:s.lev,tp=L>0&&!s.doors?L:0;
s.clock+=dt;
s.lv+=(L-s.lv)*(1-Math.exp(-dt*14));
s.px=s.x;s.tt=(s.tt||0)+dt;const v=s.v,k0=v*3.6,ntar=DC.ni+(DC.nx-DC.ni)*DC.nf[tp];
// 変速機：ノッチオフで中立。変速段→直結段は自動切替（切替中は駆動力が抜ける）
if(!tp)s.gear='N';else if(s.gear==='N'){s.gear=k0>=DC.up?'D':'T';s.sh=.7}else if(s.gear==='T'&&k0>=DC.up){s.gear='D';s.sh=.8}else if(s.gear==='D'&&k0<DC.dn){s.gear='T';s.sh=.7}
s.sh=Math.max(0,s.sh-dt);
// 機関回転数：直結中は車速に拘束、それ以外はガバナ目標へ有限の速さで追従（変速段の低速域はトルコン負荷でストール回転数止まり）
const nd=v/DC.vd*DC.nx;
if(s.gear==='D'&&s.sh<.3)s.ne+=(nd-s.ne)*(1-Math.exp(-dt*8));
else{const nt=s.gear==='N'?DC.ni:s.gear==='D'?Math.max(DC.ni,Math.min(ntar,nd)):Math.min(ntar,DC.nx*(.85+.15*Math.min(1,v/(DC.vd*.8)))),r=nt>s.ne?450:700;s.ne+=Math.max(-r*dt,Math.min(r*dt,nt-s.ne))}
// 引張力：変速段はトルコン（吸収トルク∝回転数²、トルク比は速度比で低下）、直結段は機関出力/速度（ガバナで燃料カット）
let ft=0;const nr=s.ne/DC.nx;
if(s.sh<=0&&s.gear==='T'){const vt=DC.vd*nr,e=v/vt,t=e<.8?DC.t0-(DC.t0-1)*e/.8:Math.max(0,1-(e-.8)/.17);ft=DC.pm*nr*nr*nr*t*.95/vt}
else if(s.sh<=0&&s.gear==='D'){const fu=Math.max(0,Math.min(1,(ntar-s.ne)/80));ft=DC.pm*nr*fu*.95/Math.max(v,1)}
s.ft+=(ft-s.ft)*(1-Math.exp(-dt/.25));s.pw=s.ft/3200;
// ブレーキ：直通空気ブレーキ。BC圧（kgf/cm²）が一次遅れで追従、制輪子摩擦は低速で増加
const bt=L===-9?3.9:L<0?-L/8*3.4:0,bT=bt,pb=s.bc;
