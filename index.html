<h1>運転台 鉄道運転シミュレーター</h1>

</main><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>

function showTitle(){ov.style.display='flex';ov.innerHTML='<div class="box"><h2>運転台に乗ろう</h2><p>あおば台 → みなと町 → さくら野 → とうげ。運転席からの眺めで、4駅を時刻通りに、停止位置ぴったりに走らせます。</p><ul><li>↑↓キー（またはボタン）でマスコン操作。力行 P1〜P5、ブレーキ B1〜B8、Space で非常ブレーキ</li><li>制限速度標識（白地に黒の数字）の速度を守ってください。超過が続くと減点されます（ATS-SKは速度を常時は監視しません）</li><li>停車駅の手前には「停車駅接近」の標識があります。ホームの黄色い停止位置目標に先頭を合わせて停めてください。残り距離の表示はありません</li><li>最初に力行した瞬間からダイヤ時計がスタート</li><li>車両は甘木鉄道AR301（AR300形）をモデルにした単行のワンマン気動車です。機関は295PS（定格2,100rpm）、液体式、三管式直通空気ブレーキ、最高速度は85km/h。約55km/hで変速段から直結段に自動で切り替わり、切替中は一瞬加速が途切れます。運転台の配置は、新型ARe501の運転台写真を参考にしています（AR301の実車とは異なる場合があります）。ワンハンドルのマスコン（通常は画面外。Mキーで表示を切り替え。段位と速度は左上に表示）、速度計と圧力計、モニターがあります</li><li>上り下りの勾配、トンネル、踏切があります。下り坂では何もしなくても加速します</li><li>信号は、赤＝停止、黄＝注意（45km/h以下）、青（緑）と黄＝減速（65km/h以下）、青（緑）＝進行です（速度は鉄道会社により異なります）。保安装置はATS-SK型です。注意信号を通過すると警報が鳴るので、5秒以内に「C」キーで確認してください。停止信号を越える、停止信号の手前で速度が高すぎる、警報を確認しない、のいずれかで非常ブレーキがかかり、停止後に「R」キーで復帰します</li></ul><button class="pri" id="go">運転開始</button></div>';document.getElementById('go').onclick=start}
function showEnd(){const s=S,tot=s.res.reduce((a,r)=>a+r.sp+r.pu,0)-s.pen,rk=tot>=380?'S':tot>=300?'A':tot>=220?'B':'C';

while(s.si+1<SIGS.length&&s.x>SIGS[s.si+1].x){s.si++;const ap=aspect(s.si);if(ap==='R')atsEB('即時停止（停止信号冒進）',100);else if(ap==='Y'&&!s.ats)s.atsw=5}

let FZ=0;const mix=(c,z)=>{if(c[0]!=='#'||c.length!==7)return c;const n=parseInt(c.slice(1),16),k=Math.min(.82,1-Math.exp(-z/600)),m=(a,b)=>Math.round(a+(b-a)*k);return'rgb('+m(n>>16,214)+','+m(n>>8&255,232)+','+m(n&255,242)+')'};

let R=null,SC,CAM,AMB,SUN,HL,PANO,TL=0;const SIGO=[],XO=[];
try{R=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,1.5));R.setSize(W,H,false)}catch(e){R=null}
const DS=2,S0=-160,S1=5500,NT=Math.ceil((S1-S0)/DS)+2,TX=[],TY=[],TZ=[],TH=[];
{let x=0,y=0,z=0,th=0;for(let i=0;i<NT;i++){TX[i]=x;TY[i]=y;TZ[i]=z;TH[i]=th;const m=S0+i*DS+DS/2;th+=curv(m)*DS;x+=Math.sin(th)*DS;z-=Math.cos(th)*DS;y+=grdAt(m)/1000*DS}}
function at(s){const f=(s-S0)/DS,i=Math.max(0,Math.min(NT-2,Math.floor(f))),t=Math.max(0,Math.min(1,f-i)),l=A=>A[i]+(A[i+1]-A[i])*t;return{x:l(TX),y:l(TY),z:l(TZ),th:l(TH)}}
let updV=null;const CHK=[];
function build3d(){const TV=THREE;
const cvs=(w,h,f,rep=true)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new TV.CanvasTexture(c);if(rep)t.wrapS=t.wrapT=TV.RepeatWrapping;t.anisotropy=2;return t};
const rnd=a=>()=>(a=a*16807%2147483647)/2147483647;
const Lm=(c,o)=>new TV.MeshLambertMaterial(Object.assign({color:c,side:TV.DoubleSide},o||{}));
const add=m=>{SC.add(m);return m};
const place=(o,s,lat,h,yaw)=>{const a=at(s),c=Math.cos(a.th),q=Math.sin(a.th);o.position.set(a.x+c*lat,a.y+h,a.z+q*lat);o.rotation.y=-a.th+(yaw||0)};
const lab=(t,bg,fg,w=256,h=64)=>cvs(w,h,x=>{x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle=fg;x.font='bold '+(h*.6|0)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,w/2,h/2+2)},false);

AMB=new TV.AmbientLight(0xffffff,.55);SUN=new TV.DirectionalLight(0xfff1d8,.5);SUN.position.set(.6,.9,-.3);HL=new TV.PointLight(0xfff0d0,0,70,1.5);SC.add(AMB,SUN,HL);
